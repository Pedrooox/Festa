{% extends 'base.html' %}
{% block title %}Login — FestasVIP{% endblock %}
{% block extra_style %}
<style>.auth-wrap{max-width:420px;margin:2rem auto}.auth-header{text-align:center;margin-bottom:1.8rem}.auth-header .icon{font-size:2.8rem;display:block;margin-bottom:.6rem}.auth-footer{text-align:center;margin-top:1rem;font-size:.84rem;color:#6b7280}.auth-footer a{color:#7209b7;font-weight:600;text-decoration:none}</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-header"><span class="icon">🎊</span><h1>Bem-vindo(a) de volta!</h1><p style="color:#6b7280;font-size:.88rem;margin-top:.25rem">Entre com seu e-mail e senha</p></div>
  <div class="card">
    <form method="POST">
      <div class="form-group"><label>E-mail</label><input type="email" name="email" placeholder="seu@email.com" required autofocus autocomplete="email"></div>
      <div class="form-group"><label>Senha</label><input type="password" name="senha" placeholder="••••••••" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-full">🔑 Entrar</button>
    </form>
    <div class="divider">não tem conta?</div>
    <a href="{{ url_for('cliente.cadastro') }}" class="btn btn-secondary btn-full">✨ Criar minha conta</a>
  </div>
  <div class="auth-footer"><a href="{{ url_for('cliente.index') }}">← Voltar ao início</a></div>
</div>
{% endblock %}
